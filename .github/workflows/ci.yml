name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install FFmpeg
        shell: pwsh
        run: |
          .\tools\install_ffmpeg.ps1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q -x "(build|dist|release)" .

      - name: Check JavaScript syntax
        run: node --check design/app.js

      - name: Check repository readiness
        run: python tools/check_release.py --source-only

      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests -v
