name: Сообщить об ошибке
description: Воспроизводимая проблема в Twitch Cutter Profanity
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте приватные видео, токены и журналы с персональными данными.

  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: Windows 11 24H2 x64
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: CPU и GPU
      placeholder: Ryzen 7 7700, NVIDIA RTX 4070

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Перечислите минимальные действия, которые приводят к ошибке.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение и журнал
      description: Удалите личные пути и другие чувствительные данные.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я проверил, что аналогичный issue ещё не создан.
          required: true
        - label: Я не приложил приватные медиа и чувствительные данные.
          required: true
